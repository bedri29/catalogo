<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Catálogo Digital Interactivo</title>
    <style>
        :root { 
            --azul-select: #2563eb; 
            --gris-fondo: #f1f5f9; 
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 0;
            background: var(--gris-fondo);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* BARRA LATERAL - PRODUCTOS */
        #panel-lateral { 
            width: 280px; 
            min-width: 280px;
            background: var(--slate-800); 
            color: white; 
            overflow-y: auto; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        #panel-lateral h3 {
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 2px solid var(--slate-700);
            padding-bottom: 10px;
        }
        #lista-productos-nav {
            flex-grow: 1;
        }
        .item-navegacion { 
            display: flex; 
            align-items: center; 
            padding: 10px; 
            cursor: pointer; 
            border-radius: 8px; 
            margin-bottom: 8px;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.02);
        }
        .item-navegacion:hover { 
            background: var(--slate-700); 
        }
        .item-navegacion.active-nav {
            background: var(--azul-select);
            font-weight: 600;
        }
        .item-navegacion img { 
            width: 45px; 
            height: 45px; 
            border-radius: 6px; 
            margin-right: 12px; 
            object-fit: cover;
            flex-shrink: 0;
        }
        .item-navegacion span {
            font-size: 14px;
            line-height: 1.3;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        /* ÁREA CENTRAL - DETALLES DEL PRODUCTO */
        #producto-detalles { 
            flex-grow: 1; 
            display: flex; 
            padding: 30px; 
            background: var(--gris-fondo); 
            gap: 30px; 
            overflow-y: auto; 
        }
        .seccion-imagenes { 
            display: flex; 
            gap: 15px; 
            flex: 1.2;
            max-height: 550px;
        }
        .miniaturas-vertical { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            overflow-y: auto;
            padding-right: 4px;
        }
        .miniaturas-vertical img { 
            width: 65px; 
            height: 65px; 
            object-fit: cover; 
            cursor: pointer; 
            border: 2px solid transparent; 
            border-radius: 6px;
            transition: border-color 0.2s;
        }
        .imagen-seleccionada-div { 
            flex-grow: 1; 
            background: white; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .imagen-seleccionada-div img { 
            max-width: 100%; 
            max-height: 450px; 
            object-fit: contain; 
            border-radius: 4px;
        }
        
        .seccion-info { 
            flex: 1; 
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            height: fit-content;
        }
        .seccion-info h1 {
            margin-top: 0;
            font-size: 24px;
            color: var(--slate-900);
            line-height: 1.2;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .precio-visual {
            font-size: 22px;
            font-weight: 700;
            color: var(--azul-select);
            margin: 15px 0;
        }
        .variantes-horizontal { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin-top: 12px; 
        }
        .variante-item { 
            display: flex; 
            align-items: center; 
            background: var(--gris-fondo); 
            padding: 8px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .variante-item:hover {
            background: #e2e8f0;
        }
        .variante-item img { 
            width: 35px; 
            height: 35px; 
            margin-right: 10px; 
            border-radius: 4px; 
            object-fit: cover;
        }
        .variante-item span {
            font-size: 13px;
            font-weight: 500;
        }
        .selected { 
            border-color: var(--azul-select) !important; 
            background: white !important;
            box-shadow: 0 2px 4px rgba(37,99,235,0.15);
        }
        
        /* PANEL DERECHO - CARRITO */
        #panel-carrito { 
            width: 300px; 
            min-width: 300px;
            background: white; 
            border-left: 1px solid #e2e8f0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
        }
        #panel-carrito h3 {
            margin-top: 10px;
            color: var(--slate-900);
            border-bottom: 2px solid var(--gris-fondo);
            padding-bottom: 10px;
        }
        .item-carrito { 
            font-size: 13px; 
            padding: 12px 0; 
            border-bottom: 1px solid #f1f5f9; 
            line-height: 1.4;
        }
        
        /* BOTÓN FLOTANTE MENÚ PARA MÓVILES */
        #btn-menu-movil, #btn-carrito-movil {
            display: none;
            position: fixed;
            bottom: 20px;
            background: var(--azul-select);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            cursor: pointer;
        }
        #btn-menu-movil { left: 20px; }
        #btn-carrito-movil { right: 20px; background: #10b981; }

        /* ADAPTACIÓN RESPONSIVA TOTAL */
        @media (max-width: 1024px) {
            #producto-detalles {
                flex-direction: column;
                padding: 20px;
            }
            .seccion-imagenes {
                max-height: 400px;
            }
        }

        @media (max-width: 768px) {
            body {
                position: relative;
            }
            #panel-lateral {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 999;
                transition: left 0.3s ease;
                box-shadow: 5px 0 15px rgba(0,0,0,0.2);
            }
            #panel-lateral.abierto {
                left: 0;
            }
            #panel-carrito {
                position: fixed;
                right: -300px;
                top: 0;
                height: 100vh;
                z-index: 999;
                transition: right 0.3s ease;
                box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            }
            #panel-carrito.abierto {
                right: 0;
            }
            #btn-menu-movil, #btn-carrito-movil {
                display: block;
            }
            #producto-detalles {
                padding: 15px;
                padding-bottom: 80px;
                width: 100%;
            }
            .seccion-imagenes {
                flex-direction: column-reverse;
                max-height: none;
            }
            .miniaturas-vertical {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding-bottom: 5px;
            }
            .miniaturas-vertical img {
                width: 60px;
                height: 60px;
            }
            .imagen-seleccionada-div img {
                max-height: 300px;
            }
        }
    </style>
</head>

    <script>
        let carrito = [];

        window.addEventListener('beforeunload', function (e) {
            if (carrito.length > 0) {
                e.preventDefault();
                e.returnValue = '¿Seguro que deseas salir? Perderás el progreso de los productos añadidos a tu pedido si no has exportado la lista.';
                return e.returnValue;
            }
        });

        function toggleMenu() {
            const lateral = document.getElementById('panel-lateral');
            const carritoPanel = document.getElementById('panel-carrito');
            carritoPanel.classList.remove('abierto');
            lateral.classList.toggle('abierto');
        }

        function toggleCarrito() {
            const carritoPanel = document.getElementById('panel-carrito');
            const lateral = document.getElementById('panel-lateral');
            lateral.classList.remove('abierto');
            carritoPanel.classList.toggle('abierto');
        }

        // Inyectar elementos en el navegador
        const navContainer = document.getElementById('lista-productos-nav');
        let primerTemplateId = null;

        document.querySelectorAll('template').forEach((temp, index) => {
            if(index === 0) primerTemplateId = temp.id;

            const div = document.createElement('div');
            div.className = 'item-navegacion';
            div.id = 'nav_item_' + temp.id;
            // 👉 Corrección de lectura de dataset (imgprincipal)
            div.innerHTML = `<img src="${temp.dataset.imgprincipal}"> <span>${temp.dataset.nombre}</span>`;
            
            div.onclick = () => {
                cargarProductoAVisor(temp.id, div);
            };
            navContainer.appendChild(div);
        });

        function cargarProductoAVisor(templateId, elementNav) {
            document.querySelectorAll('.item-navegacion').forEach(item => item.classList.remove('active-nav'));
            if(elementNav) elementNav.classList.add('active-nav');
            
            const temp = document.getElementById(templateId);
            const contenedor = document.getElementById('producto-detalles');
            contenedor.innerHTML = '';
            contenedor.appendChild(temp.content.cloneNode(true));
            
            document.getElementById('panel-lateral').classList.remove('abierto');
        }

        // Carga inicial automática al abrir el archivo
        if(primerTemplateId) {
            const primerNavItem = document.getElementById('nav_item_' + primerTemplateId);
            cargarProductoAVisor(primerTemplateId, primerNavItem);
        }

        function cambiarImagen(el) {
            document.getElementById('main-view').src = el.src;
            el.parentElement.querySelectorAll('img').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
        }

        function cambiarVariante(el, url) {
            document.getElementById('main-view').src = url;
            el.parentElement.querySelectorAll('.variante-item').forEach(v => v.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('precio-dinamico').textContent = el.dataset.precio;
        }

        function agregarAlCarrito(pId) {
            const template = document.getElementById('prod_' + pId);
            const nombre = template.dataset.nombre;
            const cant = parseInt(document.getElementById('cant_' + pId).value);
            const varActiva = document.querySelector('.variante-item.selected');
            const varId = varActiva ? varActiva.dataset.varId : 'var1';
            const precio = parseFloat(varActiva ? varActiva.dataset.precio : 0);
            
            const itemKey = `${pId}_${varId}`;
            const itemExiste = carrito.find(i => i.key === itemKey);
            
            if (itemExiste) {
                itemExiste.cantidad += cant;
            } else {
                carrito.push({ key: itemKey, id: pId, nombre: nombre, variante: varId, precio: precio, gig: 0, cantidad: cant });
            }
            renderCarrito();
            
            const btnCar = document.getElementById('btn-carrito-movil');
            btnCar.style.background = '#059669';
            setTimeout(() => btnCar.style.background = '#10b981', 400);
        }

        function renderCarrito() {
            const contenedor = document.getElementById('elementos-carrito');
            contenedor.innerHTML = '';
            let total = 0;
            let totalItems = 0;
            
            carrito.forEach(item => {
                total += item.precio * item.cantidad;
                totalItems += item.cantidad;
                contenedor.innerHTML += `
                    <div class='item-carrito'>
                        <b>${item.nombre}</b><br>
                        <span style='color:#64748b;'>Variante: ${item.variante}</span><br>
                        ${item.cantidad} x B/.${item.precio.toFixed(2)} = <b>B/.${(item.precio * item.cantidad).toFixed(2)}</b>
                    </div>`;
            });
            
            document.getElementById('total-carrito').textContent = total.toFixed(2);
            document.getElementById('badge-cant').textContent = totalItems;
        }

        function exportarPedido() {
            if(carrito.length === 0) return alert('El pedido está vacío.');
            let txt = "ID_PRODUCTO,VARIANTE,CANTIDAD,PRECIO_UNITARIO\n";
            carrito.forEach(i => { txt += `${i.id},${i.variante},${i.cantidad},${i.precio.toFixed(2)}\n`; });
            const blob = new Blob([txt], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'pedido_distribuidor.csv';
            a.click();
        }
    </script>
</body>
</html>
